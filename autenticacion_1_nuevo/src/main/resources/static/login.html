<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<h2>Iniciar Sesión</h2>

<form id="loginForm">

</form>

<p id="mensaje"></p>

<script src="/js/login.js"></script>

</body>
</html>
